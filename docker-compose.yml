services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    env_file:
      - .env
    environment:
      - APP_NAME=Autonomous B2B Lead-Gen & Sales Agency
      - APP_ENV=production
      - DEBUG=false
      - AUTH_ENABLED=true
      - DATABASE_URL=sqlite+aiosqlite:////app/data/agency.db
      - SYNC_DATABASE_URL=sqlite:////app/data/agency.db
      - DRY_RUN=true
      - EMAIL_DRY_RUN=true
      - VOICE_DRY_RUN=true
      - PAYMENT_DRY_RUN=true
      - COMMERCIAL_FLOOR_USD=500
      - ONE_AT_A_TIME_PROSPECTING=true
      - MAX_OUTREACH_PER_DAY=50
      - MAX_FOLLOWUPS=3
    volumes:
      - ./data:/app/data
    restart: unless-stopped
