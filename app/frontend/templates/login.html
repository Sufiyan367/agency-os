<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operator Login — {{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
            padding: 16px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .login-brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }
        .login-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }
        .login-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 14px 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: var(--primary);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: var(--primary-hover);
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            text-align: center;
        }
        .login-footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-icon">AG</div>
            <div class="login-title">Autonomous Agency</div>
            <div class="login-sub">Secure Operator Access</div>
        </div>

        <div id="login-error" class="error-banner"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Operator Username</label>
                <input id="username" type="text" class="form-input" required autocomplete="username" placeholder="admin" autofocus>
            </div>

            <div class="form-group" style="margin-top:14px;">
                <label class="form-label">Secret Password</label>
                <input id="password" type="password" class="form-input" required autocomplete="current-password" placeholder="••••••••••••">
            </div>

            <button type="submit" id="btn-submit" class="btn-login">Sign In to Dashboard</button>
        </form>

        <div class="login-footer">
            24/7 Cloud Autonomous Engine • HTTPS Encrypted
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-submit");
            const errDiv = document.getElementById("login-error");
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            btn.disabled = true;
            btn.textContent = "Authenticating...";
            errDiv.style.display = "none";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.status === "SUCCESS") {
                    window.location.href = "/";
                } else {
                    errDiv.textContent = data.detail || "Invalid operator credentials.";
                    errDiv.style.display = "block";
                    btn.disabled = false;
                    btn.textContent = "Sign In to Dashboard";
                }
            } catch (err) {
                errDiv.textContent = "Connection error. Please try again.";
                errDiv.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Sign In to Dashboard";
            }
        }
    </script>
</body>
</html>
