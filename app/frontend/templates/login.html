<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS // Operator Authorization — {{ app_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #02050b;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px, 24px 24px;
            padding: 16px;
            font-family: var(--font-body);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(4, 11, 22, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 40px 32px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 22px;
            position: relative;
            backdrop-filter: blur(14px);
        }
        /* HUD Corner Accents */
        .login-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 16px;
            height: 16px;
            border-top: 2px solid var(--cyan);
            border-left: 2px solid var(--cyan);
        }
        .login-card::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 16px;
            height: 16px;
            border-bottom: 2px solid var(--cyan);
            border-right: 2px solid var(--cyan);
        }

        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .login-title {
            font-family: var(--font-hud);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }
        .login-sub {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-input {
            width: 100%;
            background: rgba(0, 240, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 13px 16px;
            color: var(--cyan);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
            background: rgba(0, 240, 255, 0.06);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            font-family: var(--font-hud);
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 4px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(0, 112, 243, 0.35) 100%);
            color: var(--cyan);
            border: 1px solid var(--cyan);
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }
        .btn-login:hover {
            background: var(--cyan);
            color: #02050b;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
            text-shadow: none;
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .error-banner {
            background: rgba(255, 0, 85, 0.12);
            border: 1px solid var(--crimson);
            color: #ff6688;
            padding: 10px 14px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            display: none;
            text-align: center;
        }
        .login-footer {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="arc-reactor-wrap" style="width:54px; height:54px;">
                <div class="arc-ring-outer" style="width:54px; height:54px;"></div>
                <div class="arc-ring-inner" style="width:38px; height:38px;"></div>
                <div class="arc-core" style="width:22px; height:22px;"></div>
            </div>
            <div class="login-title">JARVIS // COMMAND</div>
            <div class="login-sub">RESTRICTED OPERATOR AUTHORIZATION</div>
        </div>

        <div id="login-error" class="error-banner"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">OPERATOR IDENTIFIER</label>
                <input id="username" type="text" class="form-input" required autocomplete="username" placeholder="admin" autofocus>
            </div>

            <div class="form-group" style="margin-top:14px;">
                <label class="form-label">CRYPTO-SIGNATURE KEY</label>
                <input id="password" type="password" class="form-input" required autocomplete="current-password" placeholder="••••••••••••">
            </div>

            <button type="submit" id="btn-submit" class="btn-login">AUTHORIZE ACCESS</button>
        </form>

        <div class="login-footer">
            24/7 AUTONOMOUS CLOUD ENGINE // TLS 1.3 ENCRYPTED
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-submit");
            const errDiv = document.getElementById("login-error");
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            btn.disabled = true;
            btn.textContent = "VERIFYING CREDENTIALS...";
            errDiv.style.display = "none";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.status === "SUCCESS") {
                    window.location.href = "/";
                } else {
                    errDiv.textContent = data.detail || "Access Denied: Invalid operator credentials.";
                    errDiv.style.display = "block";
                    btn.disabled = false;
                    btn.textContent = "AUTHORIZE ACCESS";
                }
            } catch (err) {
                errDiv.textContent = "Telemetry error: Unable to reach host.";
                errDiv.style.display = "block";
                btn.disabled = false;
                btn.textContent = "AUTHORIZE ACCESS";
            }
        }
    </script>
</body>
</html>
