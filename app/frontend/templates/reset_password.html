<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS // AG — Set New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #070b14;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.12), transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 0.8), transparent);
            padding: 24px 16px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f1f5f9;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            text-align: center;
        }

        .auth-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 10px;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
        }

        .auth-brand-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .auth-brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .auth-brand-sub {
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .auth-card {
            background: #0f172a;
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 14px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .auth-header {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .auth-heading {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin: 0;
        }

        .auth-description {
            font-size: 0.88rem;
            color: #94a3b8;
            line-height: 1.4;
            margin: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
            letter-spacing: 0.2px;
        }

        .form-input {
            width: 100%;
            background: #090e1a;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 12px 14px;
            color: #f8fafc;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .form-input::placeholder {
            color: #475569;
        }

        .form-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
            background: #0c1322;
        }

        .btn-primary {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            border-radius: 8px;
            background: #0284c7;
            color: #ffffff;
            border: 1px solid #38bdf8;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-primary:hover {
            background: #0369a1;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-secondary {
            width: 100%;
            padding: 11px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            background: transparent;
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-secondary:hover {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(148, 163, 184, 0.35);
        }

        .alert-box {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
        }

        .password-hint {
            font-size: 0.78rem;
            color: #64748b;
            line-height: 1.4;
        }

        .match-hint {
            font-size: 0.78rem;
            margin-top: 2px;
            min-height: 1.1em;
        }

        .auth-footer {
            text-align: center;
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Brand Header -->
        <div class="auth-brand">
            <div class="auth-logo-badge">AG</div>
            <div class="auth-brand-text">
                <span class="auth-brand-title">JARVIS // AG</span>
                <span class="auth-brand-sub">Revenue Operations</span>
            </div>
        </div>

        <!-- Reset Card -->
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-heading">Set new password</h1>
                <p class="auth-description">Create a new secure password for your account.</p>
            </div>

            <div id="reset-error" class="alert-box alert-error"></div>
            <div id="reset-success" class="alert-box alert-success"></div>

            <form id="reset-form" onsubmit="handleResetPassword(event)" style="display: flex; flex-direction: column; gap: 16px;">
                <input type="hidden" id="reset-token" value="{{ token or '' }}">

                <div class="form-group">
                    <label class="form-label" for="new_password">New Password</label>
                    <input id="new_password" type="password" class="form-input" required autocomplete="new-password" placeholder="New password (min 12 characters)" autofocus oninput="checkMatch()">
                    <span class="password-hint">Minimum 12 characters. Ensure it is unique.</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <input id="confirm_password" type="password" class="form-input" required autocomplete="new-password" placeholder="Confirm new password" oninput="checkMatch()">
                    <div id="match-hint" class="match-hint"></div>
                </div>

                <button type="submit" id="btn-reset-submit" class="btn-primary">
                    <span>Reset Password</span>
                </button>

                <a href="/login" class="btn-secondary" style="margin-top: 4px;">
                    ← Back to login
                </a>
            </form>
        </div>

        <div class="auth-footer">
            Single-use reset token verified with SHA-256
        </div>
    </div>

    <script>
        // Read token from URL query params if not pre-populated by template
        window.addEventListener('DOMContentLoaded', () => {
            const tokenInput = document.getElementById("reset-token");
            if (!tokenInput.value) {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                if (token) {
                    tokenInput.value = token;
                }
            }
        });

        function checkMatch() {
            const pw = document.getElementById("new_password").value;
            const confirm = document.getElementById("confirm_password").value;
            const hint = document.getElementById("match-hint");

            if (!confirm) {
                hint.textContent = "";
                return;
            }

            if (pw === confirm) {
                hint.textContent = "✓ Passwords match";
                hint.style.color = "#34d399";
            } else {
                hint.textContent = "✗ Passwords do not match";
                hint.style.color = "#f87171";
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-reset-submit");
            const errDiv = document.getElementById("reset-error");
            const succDiv = document.getElementById("reset-success");
            const token = document.getElementById("reset-token").value.trim();
            const new_password = document.getElementById("new_password").value;
            const confirm_password = document.getElementById("confirm_password").value;

            if (!token) {
                errDiv.textContent = "Reset token is missing. Please use the link provided in your reset email.";
                errDiv.style.display = "block";
                return;
            }

            if (new_password !== confirm_password) {
                errDiv.textContent = "Passwords do not match. Please verify your confirmation.";
                errDiv.style.display = "block";
                succDiv.style.display = "none";
                return;
            }

            if (new_password.length < 12) {
                errDiv.textContent = "Password must be at least 12 characters.";
                errDiv.style.display = "block";
                succDiv.style.display = "none";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "<span>Updating password...</span>";
            errDiv.style.display = "none";

            try {
                const res = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password, confirm_password })
                });
                const data = await res.json();
                if (res.ok && data.status === "SUCCESS") {
                    succDiv.textContent = "✓ Password reset successfully! Redirecting to login...";
                    succDiv.style.display = "block";
                    btn.innerHTML = "<span>Password Reset Complete</span>";
                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 1200);
                } else {
                    errDiv.textContent = data.detail || "Failed to reset password. The link may be expired or already used.";
                    errDiv.style.display = "block";
                    btn.disabled = false;
                    btn.innerHTML = "<span>Reset Password</span>";
                }
            } catch (err) {
                errDiv.textContent = "Unable to connect to the server. Please check your connection.";
                errDiv.style.display = "block";
                btn.disabled = false;
                btn.innerHTML = "<span>Reset Password</span>";
            }
        }
    </script>
</body>
</html>
